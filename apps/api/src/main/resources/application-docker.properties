# Docker 환경 전용 — 컨테이너 환경변수에서 값을 받는다.
# docker-compose.yml 의 api 서비스 environment 와 1:1 대응한다.
#
# 이 파일은 APP_ENV=docker 일 때만 로드된다 (RootConfig 의 @PropertySource 참고).
# 컨테이너가 어떤 환경변수를 필요로 하는지 한눈에 보여주는 문서 역할도 한다.

jdbc.driver=${JDBC_DRIVER}
jdbc.url=${JDBC_URL}
jdbc.username=${JDBC_USERNAME}
jdbc.password=${JDBC_PASSWORD}

jwt.secret=${JWT_SECRET}

google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}

# ── Swagger 문서 접근 (2026-08-14 보안 점검) ────────────
# 배포 서버는 공인 IP 라 문서가 무인증으로 공개됐었다. Basic 인증 한 겹을 둔다.
# **값을 비워두면 배포 환경에서 문서가 404 로 숨는다.** 설정 누락 시 열린 채 남는 것보다 낫다.
# 로컬(app.env=local)은 이 값과 무관하게 그대로 열린다.
swagger.access.username=${SWAGGER_ACCESS_USERNAME:}
swagger.access.password=${SWAGGER_ACCESS_PASSWORD:}

# ── 배포 환경 주소 (Vercel 프론트 + EC2 백엔드) ──────────
# vercel.json 의 rewrites 가 /api/* 를 이 백엔드로 프록시하므로
# 브라우저 관점에서 프론트와 API 는 같은 오리진이다. 그래서 SameSite=Lax 를 유지한다.
app.front-url=${APP_FRONT_URL}
google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI}
# Vercel 이 HTTPS 로 받으므로 Secure 쿠키를 쓴다
auth.cookie.secure=${AUTH_COOKIE_SECURE}

# === OpenAI monthly report analysis (issue #156) ===
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5-nano}
openai.responses-url=${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}
openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:2048}
openai.reasoning-effort=${OPENAI_REASONING_EFFORT:low}
openai.connect-timeout-millis=${OPENAI_CONNECT_TIMEOUT_MILLIS:3000}
openai.read-timeout-millis=${OPENAI_READ_TIMEOUT_MILLIS:15000}

# ── 계좌 연동 (이슈 #12) ────────────────────────────────
# 컨테이너 안에서는 목서버를 서비스명으로 부른다(compose 의 mock:8080).
# compose 의 MOCK_API_URL 과 같은 값이며, 이 프로퍼티가 실제로 읽히는 쪽이다.
financial.client=${FINANCIAL_CLIENT:mock}
financial.mock.base-url=${MOCK_API_URL:http://mock:8080}
# 실 CODEF(codef/hybrid 모드). compose 가 .env 의 CODEF_* 를 넘겨준다 — 예전에는 넘겨받기만 하고
# 여기서 읽지 않아 컨테이너에서는 CODEF 키가 늘 비어 있었다.
financial.codef.base-url=${CODEF_API_URL:https://api.codef.io}
financial.codef.client-id=${CODEF_CLIENT_ID:}
financial.codef.client-secret=${CODEF_CLIENT_SECRET:}
financial.codef.public-key=${CODEF_PUBLIC_KEY:}

# ── 이미지 저장소 (프로필 이미지 · 변론 증빙 사진) ──────
# IMAGE_STORAGE=s3 로 두면 아래 local.* 는 쓰이지 않는다.
# s3 용 image.s3.bucket·region 은 application.properties 가 AWS_S3_BUCKET·AWS_REGION 을
# 읽도록 정의해 두었다 — 여기서 다시 선언하면 같은 값이 두 곳에 생긴다.
# local 로 둘 때 컨테이너 경로는 docker-compose.yml 의 uploads 볼륨과 1:1 대응한다.
# ── 이미지 저장소 (프로필 이미지) ──────────────────────
# 컨테이너 경로는 docker-compose.yml 의 uploads 볼륨과 1:1 대응한다.
# 볼륨이 없으면 배포(down && up --build)마다 사진이 전부 사라진다.
image.storage=${IMAGE_STORAGE:local}
image.local.dir=/var/tangtang/uploads
image.local.base-url=/uploads

# ── 그룹 채팅 Redis (이슈 #174) ──────────────────────
redis.host=${REDIS_HOST:redis}
redis.port=${REDIS_PORT:6379}

# === 금융 데이터 동기화 (이슈 #147) ===
# financial.mock.base-url 과는 별개 계약이다 — 이쪽은 /api/v1/assets/* 목록·거래 조회 전용.
# 같은 mock 컨테이너를 가리키지만 프로퍼티가 달라 환경변수도 따로 준다.
mock.server.base-url=${MOCK_SERVER_BASE_URL:http://mock:8080}

# ── 토스증권 시세 연동 (이슈 #299) ──────────────────────
# 이 두 줄이 없으면 도커에서 컨텍스트 자체가 뜨지 않는다 — 프로퍼티가 "비어 있는 것"과
# "정의가 아예 없는 것"은 다르다. 후자는 PropertySourcesPlaceholderConfigurer 가
# IllegalArgumentException 을 던져 API 전체가 404 가 된다(2026-08-19 실제 장애).
# 값이 비어 있는 건 괜찮다 — 토큰 갱신만 실패 로그를 남기고 나머지는 정상 동작한다.
toss.client-id=${TOSS_CLIENT_ID:}
toss.client-secret=${TOSS_CLIENT_SECRET:}