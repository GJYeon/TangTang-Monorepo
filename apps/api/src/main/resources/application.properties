# 팀 공통 기본값. 계정·비밀번호 등 개인 값은 절대 여기 쓰지 말 것.
# 개인 값은 application-local.properties 에 작성하며, 같은 키는 그쪽이 우선한다. (git 추적 제외)
# 최초 세팅: application-local.properties.example 을 복사해 이름을 바꾸고 계정을 채운다.

jdbc.driver=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
jdbc.url=jdbc:log4jdbc:mysql://localhost:3306/tangtang?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul

# ── JWT ────────────────────────────────────────────────
# 액세스 토큰 15분 / 리프레시 토큰 14일 (초 단위)
jwt.access-token-validity=900
jwt.refresh-token-validity=1209600

# ── Google OAuth (시크릿 아닌 값만) ─────────────────────
google.oauth.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
google.oauth.token-uri=https://oauth2.googleapis.com/token
# 리다이렉트 URI 는 프론트 오리진(:5173) 기준이어야 한다.
# Vite 프록시를 거쳐야 리프레시 쿠키가 프론트와 same-origin 으로 심긴다.
# Google Cloud Console 의 "승인된 리디렉션 URI" 에도 똑같이 등록돼 있어야 한다.
google.oauth.redirect-uri=http://localhost:5173/api/auth/google/callback

# ── 프론트 주소 (콜백 후 되돌려보낼 곳) ─────────────────
app.front-url=http://localhost:5173

# ── 리프레시 쿠키 속성 ─────────────────────────────────
# 로컬은 Vite 프록시로 same-origin 이라 Lax 로 충분하다.
# 프론트와 API 도메인이 갈리는 환경에서는 None + secure=true 로 덮어쓴다.
# (SameSite=None 은 Secure 없이는 브라우저가 쿠키를 버린다)
auth.cookie.same-site=Lax
auth.cookie.secure=false

# === 동의 (이슈 #13) ===
# 약관 본문은 노션 공개 페이지에 있다. 서버는 URL 과 버전만 들고 있다.
# 버전을 올릴 때는 확정본을 docs/terms/v<버전>.md 로 백업 커밋한다(증빙용) —
# 노션은 언제든 덮어써지므로 "어느 버전이 무슨 내용이었는가" 의 증빙은 저장소가 담당한다.
#
# URL 은 슬러그 없는 page-id 형식을 쓴다. 노션은 제목이 바뀌면 슬러그도 바뀌지만
# page-id 는 고정이라, 약관 제목을 손봐도 링크가 깨지지 않는다.
consent.terms-version=v1.0
consent.url.terms=https://achieved-church-7aa.notion.site/3b22c99c4956810d9813fb65b7801dc8
consent.url.privacy=https://achieved-church-7aa.notion.site/3b22c99c495681c09db0e39f279c1590
consent.url.financial-data=https://achieved-church-7aa.notion.site/3b22c99c4956811fabd4f25a1fe704a1
consent.url.third-party=https://achieved-church-7aa.notion.site/3b22c99c49568187ade7d05fb921deb1
consent.url.ai-usage=https://achieved-church-7aa.notion.site/3b22c99c495681968785f75e413c20a9
consent.url.marketing=https://achieved-church-7aa.notion.site/3b22c99c49568191967ef766821267ca

# === 계좌 연동 (이슈 #12) ===
# 금융 데이터 공급자. mock = 목서버 / codef = 실 CODEF.
# **이 한 줄로 전환된다.** 프론트는 어느 쪽인지 알지 못한다 (DECISIONS.md 2026-08-05).
financial.client=mock
financial.mock.base-url=http://localhost:8081
# 시나리오 키는 여기서 고정하지 않는다 — 아래 mock.server.scenario-keys 를 함께 쓴다(#334).
# CODEF 키·공개키는 계정에 묶인 값이라 여기 쓰지 않는다. application-local.properties 에 넣는다.
#   financial.codef.client-id / client-secret / public-key
# 데모 환경으로 시험할 때는 base-url 을 https://development.codef.io 로 덮어쓴다.
financial.codef.base-url=https://api.codef.io

# === 금융 동기화 배치 스케줄러 (이슈 #199) ===
# 계좌·카드 연동이 있는 사용자를 주기적으로 자동 동기화한다. 수동 트리거(POST /sync)와
# 같은 FinancialSyncServiceImpl.sync()를 사용한다.
financial.sync.batch.enabled=true
# 이전 실행 완료 후부터 재는 지연(밀리초). 기본 30분.
financial.sync.batch.fixed-delay-ms=180000
# 한 틱에서 동기화할 최대 사용자 수.
financial.sync.batch.max-users-per-tick=20
# 마지막 동기화 시도 후 이 시간(분)이 지나지 않은 사용자는 다음 틱에서 제외한다.
financial.sync.batch.min-interval-minutes=10

# === 토스증권 시세 연동 ===
# 액세스 토큰 유효기간은 86,400초(24시간, 토스 문서).
# client-id/secret은 시크릿이라 여기 쓰지 않는다 — application-local.properties 에만 둔다.
# 비어 있으면 토큰 갱신이 실패 로그만 남기고 넘어간다(TossAuthScheduler) — 앱은 정상 기동한다.
#
# "갱신이 필요한지" 확인하는 주기(밀리초). 실제 토스 호출은 토큰이 없거나 만료 1시간 전(코드
# 상수)일 때만 일어난다 — 그래서 짧게 잡아도(기본 5분) 평소엔 대부분 확인이 아무 일도 안 한다.
# 이렇게 짧게 잡은 이유: 예전엔 23시간 고정 주기였는데, 갱신이 한 번 실패하면 다음 고정 주기까지
# 최대 23시간 동안 토큰 없이 방치됐다(QA 지적사항).
toss.auth.refresh-check-fixed-delay-ms=300000
# 토스 API 전용 RestTemplate 타임아웃(밀리초). 없으면 토스가 느려질 때 요청 스레드가 무한정
# 붙잡힌다(QA 지적사항) — financialSyncRestTemplate 과 같은 이유.
toss.connect-timeout-ms=3000
toss.read-timeout-ms=5000
# 보유종목 조회 시점 lazy refresh 의 심볼별 TTL(밀리초). 이 시간 안에 같은 심볼을 다시 조회하면
# 토스를 또 부르지 않고 캐시된 값을 쓴다(InvestmentPriceRefresher, MARKET_DATA 레이트리밋 보호).
toss.price.cache-ttl-ms=20000


# === 금융 데이터 동기화 (이슈 #147) ===
# API 계약은 계좌연동(financial.mock.*)과 별개다 — 이쪽은 /api/v1/assets/* 목록·거래 조회 전용.
# 다만 시나리오 키 풀(scenario-keys)은 계좌연동의 MockFinancialDataClient 도 같이 쓴다(#334) —
# 한 사용자가 항상 같은 가짜 데이터를 보게 하려면 두 흐름이 같은 ScenarioKeyProvider 를 참조해야 한다.
mock.server.base-url=${MOCK_SERVER_BASE_URL:http://localhost:8081}
mock.server.connect-timeout-ms=${MOCK_SERVER_CONNECT_TIMEOUT_MS:3000}
mock.server.read-timeout-ms=${MOCK_SERVER_READ_TIMEOUT_MS:5000}
# 콤마 구분 시나리오 키 풀. userId % pool.size() 로 하나를 고른다 (PooledScenarioKeyProvider).
# 로그인 사용자의 실제 ID를 목서버에 그대로 넘기지 않기 위함 — userId 는 인덱스 계산에만 쓰인다.

mock.server.scenario-keys=${MOCK_SERVER_SCENARIO_KEYS:1,2,3,4,5,6,7,8,9}


# === LLM 거래 카테고리화 실연동 (이슈 #147 후속) ===
# API 키는 월간 리포트 분석(#156)과 **같은 값·같은 프로퍼티**를 쓴다: openai.api-key.
# 비밀값이라 여기 쓰지 않는다 — application-local.properties(로컬) · OPENAI_API_KEY(도커) 에 둔다.
# 아래 base-url·model·타임아웃은 #156 과 다른 엔드포인트(/v1/chat/completions)를 쓰므로 따로 둔다.
openai.api.base-url=https://api.openai.com
openai.api.model=gpt-4o-mini
# OpenAI 호출 전용 RestTemplate 타임아웃(밀리초, OpenAiClientConfig).
# 스케줄러가 트랜잭션 안에서 부르는 블로킹 호출이라 상한이 없으면 스레드·DB 커넥션을 계속 붙잡는다.
openai.api.connect-timeout-ms=10000
openai.api.read-timeout-ms=30000
# 이 값 미만의 confidence 로 판정된 categoryId 는 분류 불가(null)로 취급한다.
llm.categorization.confidence-threshold=0.8
# PENDING 작업을 찾는 주기. 밀리초. NotificationDlqRetryScheduler 와 동일하게 1분.
llm.categorization.poll.fixed-delay-ms=60000
# 한 번에 처리할 최대 작업 수. 작업 하나가 최대 20건짜리 배치이므로 틱당 최대 20개 작업 * 20건 = 400건까지 처리될 수 있다.
llm.categorization.poll.max-jobs-per-tick=20

# ── 미션 자동 배정 (이슈 #139) ───────────────────────────────────
# 기본값: 매일 한국 시간 00:10. 운영 환경에서는 환경변수로 덮어쓴다.
mission.assignment.cron=${MISSION_ASSIGNMENT_CRON:0 10 0 * * *}
mission.assignment.recovery-cron=${MISSION_ASSIGNMENT_RECOVERY_CRON:0 30 0 * * *}
mission.assignment.zone=${MISSION_ASSIGNMENT_ZONE:Asia/Seoul}
# 개인 미션 알림은 알림함에 저장되고, 접속 중인 사용자에게만 SSE로 즉시 보인다.
mission.notification.deadline.cron=${MISSION_NOTIFICATION_DEADLINE_CRON:0 0 21 * * *}
# 전월 AI 명예 타이틀 생성(00:40) 이후 인증서가 완성된 시각에 월 1회 알린다.
mission.notification.certificate.cron=${MISSION_NOTIFICATION_CERTIFICATE_CRON:0 50 0 1 * *}

# ── 개인 미션 인증서 AI 명예 타이틀 (이슈 #273) ─────────────────
# 00:10 미션 판정·배정, 00:30 복구 배치 이후에 전월 타이틀을 생성한다.
mission.certificate.title.batch.cron=${MISSION_CERTIFICATE_TITLE_BATCH_CRON:0 40 0 1 * *}
mission.certificate.title.batch.recovery-cron=${MISSION_CERTIFICATE_TITLE_BATCH_RECOVERY_CRON:0 10 1 1 * *}
mission.certificate.title.batch.max-attempts=${MISSION_CERTIFICATE_TITLE_BATCH_MAX_ATTEMPTS:2}
mission.certificate.title.batch.retry-delay-minutes=${MISSION_CERTIFICATE_TITLE_BATCH_RETRY_DELAY_MINUTES:20}

# ── 개인 챌린지 월 확정 배치 (이슈 #244) ─────────────────────────
# 전날 미션 판정(00:10)이 끝난 뒤, 매월 1일에 지난달의 최종 판정 결과만 확정한다.
challenge.report.monthly.zone=${CHALLENGE_REPORT_MONTHLY_ZONE:Asia/Seoul}
challenge.report.monthly.batch.cron=${CHALLENGE_REPORT_MONTHLY_BATCH_CRON:0 20 0 1 * *}
# 월말 종료 그룹은 확정이 익월로 넘어가는 것이 정상이라, 그룹 전적만 따로 보강한다.
# 주 경로는 확정 즉시 도는 GroupChallengeClosedListener 이고 이 cron 은 안전망이다(이슈 #172).
# **창을 2일 00:40 한 번으로 좁히지 말 것.** 투표 마감이 기소 + 30시간이라 말일 종료 그룹의 확정은
# 그 시각을 넘기는 경우가 흔하다. 한 번만 돌면 그 그룹의 전적은 영영 못 채운다 — 다음 달 cron 은
# 그 다음 달을 보기 때문이다. 4일간 6시간마다 돌려 이벤트 유실·배포 재시작까지 덮는다.
# updateMonthlyGroupRecord 가 user_id + year_month UPDATE 라 여러 번 돌아도 결과가 같다.
challenge.report.monthly.group-record-recovery.cron=${CHALLENGE_REPORT_MONTHLY_GROUP_RECORD_RECOVERY_CRON:0 40 */6 2-5 * *}

# ── 그룹 챌린지 시작 상태 전이 배치 (이슈 #152) ─────────────────
# 기본값: 매일 한국 시간 00:01. 미션 자동 배정(00:10)보다 앞서 돈다 —
# 미션은 챌린지가 ACTIVE 인 것을 전제로 하므로 상태 전이가 먼저여야 한다.
# **00:00 정각으로 당기지 말 것.** 기준일을 배치 안에서 LocalDate.now(zone) 로 계산하는데,
# 정각에는 이 값이 전날로 나올 수 있다(트리거가 미세하게 일찍 발화하거나 NTP 가 시계를 되돌리는 경우).
# 그러면 그날 시작하는 그룹이 통째로 누락되고, 다음 날 배치가 주워 담을 때까지 하루 동안
# "시작일인데 모집중" 인 화면이 남는다. 1분이면 이 위험이 사라진다.
challenge.group.status-transition.cron=${CHALLENGE_GROUP_STATUS_TRANSITION_CRON:0 1 0 * * *}
challenge.group.status-transition.zone=${CHALLENGE_GROUP_STATUS_TRANSITION_ZONE:Asia/Seoul}

# ── 그룹 챌린지 평가·기소 배치 (이슈 #168) ──────────────────────
# 이전 실행이 끝난 뒤부터 재는 지연(밀리초). 기본 5분.
# fixedRate 가 아닌 이유: 한 틱이 5분을 넘기면 다음 틱이 겹쳐 같은 그룹을 두 스레드가 평가한다.
#
# 거래 동기화(financial.sync.batch.fixed-delay-ms) 와 주기를 맞추면 반영이 가장 빠르지만
# **맞아야만 동작하는 것은 아니다.** 배치가 매 틱 어제·오늘 두 날짜를 다시 집계하므로
# 동기화가 늦게 도착해도 다음 틱이 주워 담는다. 주기를 늘리면 기소가 늦어질 뿐 누락되지 않는다.
challenge.group.evaluation.fixed-delay-ms=${CHALLENGE_GROUP_EVALUATION_FIXED_DELAY_MS:300000}
# 기준일(LocalDate.now(zone)) 계산에만 쓴다. 챌린지 날짜 경계는 한국 시간이 기준이다.
challenge.group.evaluation.zone=${CHALLENGE_GROUP_EVALUATION_ZONE:Asia/Seoul}

# ── 재판 마감 시각 (이슈 #169 에서 정의, #170·#172 가 재사용) ────
# tbl_indictment 에는 마감 컬럼이 없다. schema.sql 의 [0803] 주석이 계산식을 못 박는다.
#   변론 마감 = created_at + defense-hours
#   투표 마감 = created_at + defense-hours + vote-hours
# 값을 늘리거나 줄이면 이미 생성된 기소의 마감도 함께 움직인다 — 저장된 값이 아니라 계산값이기 때문이다.
# 시연 중 마감을 앞당겨 보고 싶으면 환경변수로 줄인다. 코드를 고칠 필요는 없다.
challenge.trial.defense-hours=${CHALLENGE_DEFENSE_HOURS:6}
challenge.trial.vote-hours=${CHALLENGE_VOTE_HOURS:24}
# 변론 마감 배치 주기 (이슈 #170). 기본 5분.
# **일일 cron 에 붙이지 않은 이유**: 변론 창이 6시간인데 하루 한 번 검사하면 마감이 지난 재판이
# 최대 24시간 멈춘다. 투표 마감(기소 + 30시간)은 그대로 흘러 표를 받지 못한 채 개표된다.
# 이 값을 줄여도 판정은 바뀌지 않는다 — 마감 시각의 근거는 defense-hours 하나다.
challenge.trial.deadline.fixed-delay-ms=${CHALLENGE_TRIAL_DEADLINE_FIXED_DELAY_MS:300000}
# 개표 배치 주기 (이슈 #172). 기본 1분 — 변론 마감 배치(5분)보다 짧다.
# 개표 대상은 「투표 마감이 지났거나, 투표할 사람이 전부 던졌거나」다. 뒤쪽이 이 주기에 직접 걸린다 —
# 마지막 표를 던진 사람이 결과를 보기까지의 지연이 그대로 이 값이다. 5분이면 전원이 투표를 끝내고도
# 화면이 「투표 완료」인 채로 최대 5분 멈춰 있어 사용자는 서비스가 멈춘 줄 안다(팀 결정 2026-08-18).
# 확정할 재판이 없으면 SELECT 한 번으로 끝나므로 주기를 줄여도 비용이 거의 없다.
challenge.trial.verdict.fixed-delay-ms=${CHALLENGE_TRIAL_VERDICT_FIXED_DELAY_MS:60000}
# 판사 탕이 — 표가 동률일 때만 부르는 LLM 판결 (이슈 #172).
# API 키는 월간 리포트 분석(#156)과 **같은 값·같은 프로퍼티**를 쓴다: openai.api-key.
# 엔드포인트도 같은 Responses API 라 openai.responses-url 을 공유한다. 모델·타임아웃만 따로 둔다 —
# 저쪽은 사용자가 화면 앞에서 기다리는 요청이고 이쪽은 스케줄러가 도는 배치라 조정 시점이 다르다.
# ⚠ read-timeout 은 개표 주기(1분)보다 짧아야 한다. 길면 앞 틱이 응답을 기다리는 동안 다음 틱이 밀린다.
challenge.trial.ai-verdict.model=${CHALLENGE_AI_VERDICT_MODEL:gpt-5-nano}
challenge.trial.ai-verdict.max-output-tokens=${CHALLENGE_AI_VERDICT_MAX_OUTPUT_TOKENS:1024}
challenge.trial.ai-verdict.reasoning-effort=${CHALLENGE_AI_VERDICT_REASONING_EFFORT:low}
challenge.trial.ai-verdict.connect-timeout-ms=${CHALLENGE_AI_VERDICT_CONNECT_TIMEOUT_MS:3000}
challenge.trial.ai-verdict.read-timeout-ms=${CHALLENGE_AI_VERDICT_READ_TIMEOUT_MS:15000}

# === 월간 소비 리포트 자동 생성 (이슈 #158) ======================================
# 매월 1일 00:15 KST에 이전 달만 생성한다. 기동 시 과거 월을 자동 보정하지 않는다.
report.monthly.zone=${REPORT_MONTHLY_ZONE:Asia/Seoul}
report.monthly.batch.cron=${REPORT_MONTHLY_BATCH_CRON:0 15 0 1 * *}
# 일시 장애는 1~3일 00:40 KST에만 복구한다. 00:15 최초 실행과 20분 이상 간격을 둔다.
report.monthly.batch.recovery-cron=${REPORT_MONTHLY_BATCH_RECOVERY_CRON:0 40 0 1-3 * *}
report.monthly.batch.max-auto-attempts=${REPORT_MONTHLY_BATCH_MAX_AUTO_ATTEMPTS:3}
report.monthly.batch.retry-delay-minutes=${REPORT_MONTHLY_BATCH_RETRY_DELAY_MINUTES:20}
# 배포·로컬 수동 배치 보호 키. 값은 환경변수로만 주입하고, 비어 있으면 API를 비활성화한다.
report.monthly.manual-batch.key=${REPORT_MONTHLY_MANUAL_BATCH_KEY:}

# === 월간 고정지출 탐지 (이슈 #203) =============================================
# 거래 동기화 이후의 일일 보정 탐지. 실제 거래 동기화 시각에 맞춰 환경변수로 조정한다.
# ⚠ 환경변수로 조정하려면 docker-compose.yml 의 api.environment 에도 같은 키가 있어야 한다.
#   2026-08-20 (#387) 이전에는 배선이 없어 .env 에 적은 값이 조용히 무시됐다.
fixed.expense.detection.zone=${FIXED_EXPENSE_DETECTION_ZONE:Asia/Seoul}
# 23:00 인 이유(#387): 동기화 배치는 20분 주기로 계속 돌지만, 탐지가 이르면 저녁 소비
# (외식·배달·귀갓길 결제)가 그날 탐지에 잡히지 않고 다음 날로 밀린다. 하루 소비가
# 사실상 끝난 시각에 돌린다. 21:00 미션 마감 알림과도 겹치지 않는다.
fixed.expense.detection.cron=${FIXED_EXPENSE_DETECTION_CRON:0 0 23 * * *}

# === 이미지 저장소 (프로필 이미지 · 변론 증빙 사진) ===
# 구현 전환은 이 한 줄로 한다 — financial.client 와 같은 방식이다.
#   local = 파일시스템 / s3 = AWS S3 (이슈 #162)
# 프로필(profile/**)과 변론 증빙(defense/**)이 같은 저장소를 쓴다. 바꾸면 둘 다 함께 바뀐다.
image.storage=${IMAGE_STORAGE:local}
# 영구 저장 경로. WebConfig 의 tangtang.upload.dir(멀티파트 임시 경로)과 다른 값이다.
image.local.dir=${TANGTANG_IMAGE_DIR:${java.io.tmpdir}/tangtang-images}
# ServletConfig 가 이 경로를 /uploads/** 로 서빙한다.
image.local.base-url=/uploads
# 아래 둘은 image.storage=s3 일 때만 쓰인다. local 이면 비어 있어도 정상이다.
# 자격증명(AWS_ACCESS_KEY_ID·AWS_SECRET_ACCESS_KEY)은 프로퍼티로 받지 않는다 —
# AWS SDK 의 기본 탐색 체인(환경변수 → ~/.aws → EC2 IAM 역할)이 알아서 찾는다.
image.s3.bucket=${AWS_S3_BUCKET:}
image.s3.region=${AWS_REGION:ap-northeast-2}
